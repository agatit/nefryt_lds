[project]
name = "nefrytlds-backend-trends-writer"
version = "1.0.0"
description = "System LDS Backend Trends Writer"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "sqlalchemy==2.0.49",
    "pyyaml==6.0.3",
    "sqlmodel==0.0.38",
    "pymodbus==3.13.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "pyodbc==5.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "testcontainers==4.14.2",
    "starlette==1.0.0",
    "httpx==0.28.1"
]

[tool.setuptools]
packages = [
    "api",
    "control",
    "database",
    "leak_detector",
    "trends_writer",
    "model_data_generator",
    "simulator"
]
