[project]
name = "nefrytlds-backend-api"
version = "1.0.0"
description = "System LDS Backend Api"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.1",
    "fastapi-pagination==0.15.12",
    "sqlalchemy==2.0.49",
    "sqlmodel==0.0.38",
    "pyjwt==2.12.1",
    "odata-query==0.10.0",
    "pyyaml==6.0.3",
    "uvicorn==0.46.0",
    "pyodbc==5.3.0",
    "bcrypt==5.0.0",
    "mypy==2.0.0",
    "black==26.3.1",
    "pwdlib[argon2]==0.3.0",
    "alembic==1.18.4"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "pydantic-settings==2.14.1",
    "testcontainers==4.14.2"
]

[tool.setuptools]
packages = [
    "api",
    "control",
    "database",
    "leak_detector",
    "trends_writer",
    "model_data_generator",
    "simulator"
]
